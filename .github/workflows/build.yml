name: Build KidTube APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Create Android project
        run: |
          mkdir -p app/src/main/java/com/kidtube/offline

          cat > gradle.properties <<'EOF'
          android.useAndroidX=true
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          EOF

          cat > settings.gradle.kts <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "KidTube"
          include(":app")
          EOF

          cat > build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.7.3" apply false
              id("org.jetbrains.kotlin.android") version "2.0.21" apply false
          }
          EOF

          cat > app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.kidtube.offline"
              compileSdk = 35

              defaultConfig {
                  applicationId = "com.kidtube.offline"
                  minSdk = 23
                  targetSdk = 35
                  versionCode = 1
                  versionName = "1.0"
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = "17"
              }
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application
                  android:theme="@android:style/Theme.Material.Light.NoActionBar"
                  android:label="KidTube">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > app/src/main/java/com/kidtube/offline/MainActivity.kt <<'EOF'
          package com.kidtube.offline

          import android.app.Activity
          import android.os.Bundle
          import android.content.Intent
          import android.net.Uri
          import android.view.Gravity
          import android.widget.*

          class MainActivity : Activity() {
              private lateinit var list: LinearLayout
              private lateinit var player: VideoView
              private val videos = mutableListOf<Pair<String, Uri>>()

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)

                  val root = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(24, 24, 24, 24)
                      setBackgroundColor(0xFFFFF8E8.toInt())
                  }

                  root.addView(TextView(this).apply {
                      text = "🐻 KidTube"
                      textSize = 30f
                      gravity = Gravity.CENTER
                      setTextColor(0xFF315B45.toInt())
                  })

                  root.addView(Button(this).apply {
                      text = "＋ Add videos"
                      setOnClickListener {
                          val intent = Intent(Intent.ACTION_OPEN_DOCUMENT).apply {
                              type = "video/*"
                              putExtra(Intent.EXTRA_ALLOW_MULTIPLE, true)
                              addCategory(Intent.CATEGORY_OPENABLE)
                              addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION)
                              addFlags(Intent.FLAG_GRANT_PERSISTABLE_URI_PERMISSION)
                          }
                          startActivityForResult(intent, 1001)
                      }
                  })

                  player = VideoView(this)
                  root.addView(player, LinearLayout.LayoutParams(-1, 240))

                  root.addView(TextView(this).apply {
                      text = "My video library"
                      textSize = 21f
                      setTextColor(0xFF315B45.toInt())
                  })

                  list = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                  }
                  root.addView(list)

                  setContentView(ScrollView(this).apply {
                      addView(root)
                  })
              }

              @Deprecated("Use Activity Result APIs in a future version")
              override fun onActivityResult(
                  requestCode: Int,
                  resultCode: Int,
                  data: Intent?
              ) {
                  super.onActivityResult(requestCode, resultCode, data)

                  if (requestCode == 1001 && resultCode == RESULT_OK && data != null) {
                      val selected = mutableListOf<Uri>()

                      data.clipData?.let { clip ->
                          for (i in 0 until clip.itemCount) {
                              selected.add(clip.getItemAt(i).uri)
                          }
                      } ?: data.data?.let {
                          selected.add(it)
                      }

                      selected.forEach { uri ->
                          try {
                              contentResolver.takePersistableUriPermission(
                                  uri,
                                  Intent.FLAG_GRANT_READ_URI_PERMISSION
                              )
                          } catch (_: Exception) {
                          }

                          videos.add(
                              (uri.lastPathSegment ?: "My video") to uri
                          )
                      }

                      showVideos()
                  }
              }

              private fun showVideos() {
                  list.removeAllViews()

                  videos.forEach { (name, uri) ->
                      list.addView(Button(this).apply {
                          text = "▶ $name"
                          setOnClickListener {
                              player.setVideoURI(uri)
                              player.start()
                          }
                      })
                  }
              }

              override fun onPause() {
                  super.onPause()
                  if (::player.isInitialized && player.isPlaying) {
                      player.pause()
                  }
              }
          }
          EOF

      - name: Build APK
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: KidTube-Android-APK
          path: app/build/outputs/apk/debug/app-debug.apk
